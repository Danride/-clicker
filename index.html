<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VK Кликер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, sans-serif;
            background: #f0f2f5;
            padding: 20px;
        }
        .app {
            background: white;
            padding: 30px;
            border-radius: 28px;
            text-align: center;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
        }
        h1 { font-size: 28px; margin-bottom: 5px; }
        .subtitle { color: #888; font-size: 14px; margin-bottom: 20px; }
        #counter {
            font-size: 72px;
            font-weight: 800;
            color: #2d81e0;
            margin: 20px 0;
        }
        #clickBtn {
            background: #2d81e0;
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 60px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 6px 0 #1a4f8b;
            transition: transform 0.1s;
        }
        #clickBtn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #1a4f8b;
        }
        #resetBtn {
            background: none;
            border: 1px solid #ddd;
            padding: 8px 24px;
            border-radius: 30px;
            color: #888;
            margin-top: 15px;
            cursor: pointer;
        }
        #vk-status {
            margin-top: 15px;
            font-size: 12px;
            color: #999;
            padding: 5px;
        }
        .status-ok { color: #2d81e0 !important; }
        .status-error { color: #e74c3c !important; }
        .status-warning { color: #f39c12 !important; }
    </style>
</head>
<body>
    <div class="app">
        <h1>🍪 Кликер</h1>
        <div class="subtitle">нажми на печеньку</div>
        <div id="counter">0</div>
        <button id="clickBtn">Кликни меня!</button>
        <br>
        <button id="resetBtn">Сбросить</button>
        <div id="vk-status">⏳ Подключение к VK...</div>
    </div>

    <!-- ============================================================ -->
    <!-- ====== ГЛАВНОЕ: ПОДКЛЮЧЕНИЕ VK BRIDGE ====== -->
    <!-- ============================================================ -->
    <script src="https://vk.com/js/api/xd_connection.js?2"></script>
    
    <script>
        // ============================================================
        // 1. ИНИЦИАЛИЗАЦИЯ VK BRIDGE (ОБЯЗАТЕЛЬНО!)
        // ============================================================
        const statusEl = document.getElementById('vk-status');
        
        // Функция для обновления статуса
        function setStatus(text, className) {
            statusEl.textContent = text;
            statusEl.className = className || '';
        }

        // Пытаемся инициализировать VK
        try {
            if (typeof VK !== 'undefined') {
                VK.init(
                    function() {
                        // Успешно!
                        setStatus('✅ VK Bridge подключен! Приложение работает', 'status-ok');
                        console.log('✅ VK инициализирован успешно');
                    },
                    function(error) {
                        // VK есть, но инициализация выдала ошибку
                        setStatus('⚠️ VK Bridge доступен, но есть ошибка', 'status-warning');
                        console.warn('⚠️ Ошибка VK:', error);
                    }
                );
            } else {
                // VK Bridge не загрузился
                setStatus('❌ VK Bridge не загружен. Проверьте интернет.', 'status-error');
                console.error('❌ VK не определен');
            }
        } catch(e) {
            // Критическая ошибка
            setStatus('❌ Ошибка загрузки VK Bridge', 'status-error');
            console.error('❌ Критическая ошибка:', e);
        }

        // ============================================================
        // 2. ЛОГИКА КЛИКЕРА
        // ============================================================
        let count = 0;
        const counterEl = document.getElementById('counter');
        const clickBtn = document.getElementById('clickBtn');
        const resetBtn = document.getElementById('resetBtn');

        function updateCounter() {
            counterEl.textContent = count;
            // Анимация
            counterEl.style.transform = 'scale(1.2)';
            setTimeout(() => { counterEl.style.transform = 'scale(1)'; }, 150);
            // Сохранение
            localStorage.setItem('clicker_count', count);
        }

        clickBtn.onclick = function() {
            count++;
            updateCounter();
            // Вибрация на мобильных
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(10);
            }
        };

        resetBtn.onclick = function() {
            if (confirm('Сбросить счет?')) {
                count = 0;
                updateCounter();
            }
        };

        // Загрузка сохраненного счета
        const saved = localStorage.getItem('clicker_count');
        if (saved !== null) {
            count = parseInt(saved, 10);
            counterEl.textContent = count;
        }

        console.log('✅ Кликер загружен, счет:', count);
    </script>
</body>
</html>
