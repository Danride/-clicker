<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<meta name="theme-color" content="#080808">

<title>BLACK BAG</title>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- VK BRIDGE -->

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080808;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    display: flex;
    justify-content: center;
}

.app {
    width: 100%;
    max-width: 520px;
    height: 100dvh;
    background: #0b0b0b;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
}

/* =========================
   HEADER
========================= */

header {
    height: 65px;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #242424;
}

.logo {
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 4px;
}

.connection {
    font-size: 9px;
    letter-spacing: 2px;
    color: #555;
}

.connection.online {
    color: #aaa;
}

/* =========================
   MAIN
========================= */

main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.balance-label {
    color: #555;
    font-size: 9px;
    letter-spacing: 4px;
    margin-bottom: 20px;
}

.balance {
    font-size: 48px;
    font-weight: 900;
    letter-spacing: -2px;

    margin-top: -20px;
}

.currency {
    font-size: 14px;
    color: #666;
    margin-left: 5px;
}

/* =========================
   BAG
========================= */

.bag-wrapper {
    width: min(76vw, 320px);
    height: min(76vw, 320px);

    margin: -20px 0 15px;

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    touch-action: none;
    user-select: none;
}



/* PNG МЕШОК */

.bag {
    width: 68%;
    height: 74%;

    object-fit: contain;
 image-rendering: auto;

    position: relative;

    

    filter:
    

    transition: transform .08s ease;

    pointer-events: none;
}

.bag.hit {
    animation: bagHit .16s ease;
}

@keyframes bagHit {

    0% {
        transform: rotate(-3deg) scale(1);
    }

    50% {
        transform: rotate(4deg) scale(.92);
    }

    100% {
        transform: rotate(-3deg) scale(1);
    }
}

/* =========================
   HINT
========================= */

.hint {
    color: #555;

    font-size: 9px;

    letter-spacing: 3px;
}

/* =========================
   STATS
========================= */

.stats {
    width: 100%;

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 8px;

    margin-top: 18px;
}

.stat {
    background: #0f0f0f;

    border: 1px solid #222;

    padding: 12px;
}

.stat-value {
    font-size: 15px;
    font-weight: 900;
}

.stat-label {
    margin-top: 4px;

    font-size: 8px;

    letter-spacing: 1px;

    color: #555;
}

/* =========================
   NAV
========================= */

nav {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    border-top: 1px solid #222;

    background: #090909;

    padding-bottom:
        env(safe-area-inset-bottom);
}

.nav-button {
    height: 58px;

    border: none;

    background: transparent;

    color: #555;

    font-size: 9px;

    letter-spacing: 2px;
}

.nav-button.active {
    color: #fff;
}

/* =========================
   PANELS
========================= */

.panel {
    position: absolute;

    inset: 0;

    background: #0b0b0b;

    z-index: 20;

    padding: 25px 20px;

    transform:
        translateY(100%);

    transition:
        transform .22s ease;

    overflow-y: auto;
}

.panel.open {
    transform:
        translateY(0);
}

.panel-header {
    display: flex;

    align-items: center;

    justify-content: space-between;

    border-bottom: 1px solid #222;

    padding-bottom: 15px;

    margin-bottom: 18px;
}

.panel-title {
    font-size: 14px;

    font-weight: 900;

    letter-spacing: 3px;
}

.close-button {
    width: 34px;
    height: 34px;

    border: 1px solid #292929;

    background: #151515;

    color: #fff;

    font-size: 18px;
}

/* =========================
   SHOP
========================= */

.shop-item {
    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 15px;

    margin-bottom: 8px;

    border: 1px solid #242424;

    background: #0e0e0e;
}

.shop-name {
    font-size: 12px;

    font-weight: 900;
}

.shop-description {
    margin-top: 4px;

    color: #555;

    font-size: 9px;
}

.shop-buy {
    border: none;

    background: #eee;

    color: #080808;

    padding: 9px 12px;

    font-size: 9px;

    font-weight: 900;

    letter-spacing: 1px;
}

.shop-buy:disabled {
    opacity: .25;
}

/* =========================
   LEADERBOARD
========================= */

.leader {
    display: grid;

    grid-template-columns:
        40px 1fr auto;

    gap: 10px;

    align-items: center;

    padding: 14px 0;

    border-bottom: 1px solid #1d1d1d;
}

.leader-place {
    color: #555;

    font-weight: 900;
}

.leader-name {
    font-size: 12px;
}

.leader-balance {
    font-size: 12px;

    font-weight: 900;
}

.empty {
    color: #555;

    font-size: 11px;
}

/* =========================
   TOAST
========================= */

.toast {
    position: fixed;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    padding: 0;

    background: transparent;

    color: white;

    font-size: 14px;
    font-weight: 900;

    text-shadow:
        0 2px 5px rgba(0, 0, 0, .8);

    pointer-events: none;

    opacity: 0;

    z-index: 1000;
}

.toast.show {
    animation: toastAnimation .65s ease;
}

@keyframes toastAnimation {

    0% {
        opacity: 0;
        transform:
            translate(-50%, -20%)
            scale(.8);
    }

    20% {
        opacity: 1;
        transform:
            translate(-50%, -50%)
            scale(1);
    }

    70% {
        opacity: 1;
        transform:
            translate(-50%, -50%)
            scale(1);
    }

    100% {
        opacity: 0;
        transform:
            translate(-50%, -100%)
            scale(1.05);
    }
}
</style>
</head>

</div>

        <!-- STATS -->

                    id="power"

        <div id="leadersList">
            <div class="empty">

            </div>
        </div>

    </section>


    <div
        id="toast"

</div>


<script>

/* =========================================================
   SUPABASE
   ========================================================= */

/*
   ПОКА НИЧЕГО НЕ МЕНЯЙ, КРОМЕ ЭТИХ ДВУХ СТРОК.

   Supabase:
   Project Settings
   ↓
   API
*/

const SUPABASE_URL =
    "https://zlaykoibaxxohvpqqzyr.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_mEiAWaehBEhKrwQ_tcWFvQ_-VqEuon2";


let supabaseClient = null;

if (
    !SUPABASE_URL.includes("ВСТАВЬ") &&
    !SUPABASE_ANON_KEY.includes("ВСТАВЬ")
) {

    supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );
}


/* =========================================================
   GAME DATA
   ========================================================= */

let player = {

    id:
        "guest_" +
        Math.random()
            .toString(36)
            .substring(2),

    name:
        "Игрок"

};


let game = {

    balance: 0,

    power: 1,

    swipes: 0

};


/* =========================================================
   DOM
   ========================================================= */

const balanceElement =
    document.getElementById("balance");

const powerElement =
    document.getElementById("power");

const swipesElement =
    document.getElementById("swipes");

const bag =
    document.getElementById("bag");

const bagWrapper =
    document.getElementById("bagWrapper");

const connection =
    document.getElementById("connection");

const toast =
    document.getElementById("toast");


/* =========================================================
   FORMAT
   ========================================================= */

function formatNumber(number) {

    return Math
        .floor(number)
        .toLocaleString("ru-RU");

}


/* =========================================================
   RENDER
   ========================================================= */
function render() {

    balanceElement.textContent =
        formatNumber(game.balance);

    // Уменьшаем баланс при увеличении количества цифр
    const digits = String(Math.floor(game.balance)).length;

    let size = 48 - (digits - 3) * 3;

    // Минимум 28px, максимум 48px
    size = Math.max(28, Math.min(48, size));

    balanceElement.style.fontSize = size + "px";


    powerElement.textContent =
        formatNumber(game.power) + " ₽";

    swipesElement.textContent =
        formatNumber(game.swipes);

}


/* =========================================================
   TOAST
   ========================================================= */

function showToast(text) {

    toast.textContent = text;

    const rect = bagWrapper.getBoundingClientRect();

    const x =
        rect.left +
        rect.width * (0.25 + Math.random() * 0.5);

    const y =
        rect.top +
        rect.height * (0.25 + Math.random() * 0.5);

    toast.style.left = x + "px";
    toast.style.top = y + "px";

    toast.classList.remove("show");

    void toast.offsetWidth;

    toast.classList.add("show");
}

/* =========================================================
   VK BRIDGE
   ========================================================= */

async function initVK() {

    try {

        await vkBridge.send(
            "VKWebAppInit"
        );


        const user =
            await vkBridge.send(
                "VKWebAppGetUserInfo"
            );


        if (user && user.id) {

            player.id =
                String(user.id);

            player.name =
                (
                    user.first_name +
                    " " +
                    user.last_name
                ).trim();

        }


        connection.textContent =
            "VK CONNECTED";

        connection.classList.add(
            "online"
        );


    } catch (error) {

        console.log(
            "VK Bridge:",
            error
        );

        connection.textContent =
            "BROWSER MODE";

    }

}


/* =========================================================
   LOAD PLAYER
   ========================================================= */

async function loadPlayer() {

    if (!supabaseClient) {

        connection.textContent =
            "SUPABASE NOT SET";

        return;

    }


    try {

        const {

            data,

            error

        } = await supabaseClient

            .from("players")

            .select(
                "balance,power,swipes,name"
            )

            .eq(
                "vk_id",
                player.id
            )

            .maybeSingle();


        if (error) {

            throw error;

        }


        if (data) {

            game.balance =
                Number(data.balance) || 0;

            game.power =
                Number(data.power) || 1;

            game.swipes =
                Number(data.swipes) || 0;

        }


        connection.textContent =
            "ONLINE";

        connection.classList.add(
            "online"
        );


        render();


    } catch (error) {

        console.error(
            "Supabase LOAD:",
            error
        );

        connection.textContent =
            "DATABASE ERROR";

    }

}


/* =========================================================
   SAVE PLAYER
   ========================================================= */

let saveTimeout = null;


function scheduleSave() {

    clearTimeout(
        saveTimeout
    );

    saveTimeout =
        setTimeout(
            savePlayer,
            1000
        );

}


async function savePlayer() {

    if (!supabaseClient) {

        return;

    }


    try {

        const data = {

            vk_id:
                player.id,

            name:
                player.name,

            balance:
                Math.floor(
                    game.balance
                ),

            power:
                Math.floor(
                    game.power
                ),

            swipes:
                Math.floor(
                    game.swipes
                ),

            updated_at:
                new Date()
                    .toISOString()

        };


        const {

            error

        } = await supabaseClient

            .from("players")

            .upsert(
                data,
                {
                    onConflict:
                        "vk_id"
                }
            );


        if (error) {

            throw error;

        }


        console.log(
            "GAME SAVED"
        );


    } catch (error) {

        console.error(
            "Supabase SAVE:",
            error
        );

    }

}


/* =========================================================
   SWIPE SYSTEM
   ========================================================= */

let startX = 0;

let startY = 0;

let startTime = 0;

let touching = false;


bagWrapper.addEventListener(
    "pointerdown",
    function(event) {

        touching = true;

        startX =
            event.clientX;

        startY =
            event.clientY;

        startTime =
            performance.now();

        bagWrapper
            .setPointerCapture?.(
                event.pointerId
            );

    }
);


bagWrapper.addEventListener(
    "pointerup",
    function(event) {

        if (!touching) {

            return;

        }

        touching = false;


        const dx =
            event.clientX -
            startX;

        const dy =
            event.clientY -
            startY;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        const duration =
            performance.now() -
            startTime;


        /*
           ВАЖНО:

           Обычный клик не считается.

           Нужен свайп минимум 45px.
        */

        if (
            distance < 45 ||
            duration > 1200
        ) {

            return;

        }


        makeMoney();

    }
);


bagWrapper.addEventListener(
    "pointercancel",
    function() {

        touching = false;

    }
);


/* =========================================================
   MAKE MONEY
   ========================================================= */

function makeMoney() {

    game.balance +=
        game.power;


    game.swipes++;


    bag.classList.remove(
        "hit"
    );

    void bag.offsetWidth;

    bag.classList.add(
        "hit"
    );


    showToast(
        "+" +
        formatNumber(
            game.power
        ) +
        " ₽"
    );


    render();


    scheduleSave();

}


/* =========================================================
   SHOP
   ========================================================= */

const upgrades = [

    {
        name:
            "Бабуля скамер",

        description:
            "+1 ₽ за свайп",

        cost:
            50,

        add:
            1,

        level:
            0
    },

    {
        name:
            "Бомжара",

        description:
            "+5 ₽ за свайп",

        cost:
            500,

        add:
            5,

        level:
            0
    },

    {
        name:
            "Школьник-задрот",

        description:
            "+25 ₽ за свайп",

        cost:
            5000,

        add:
            25,

        level:
            0
    },

    {
        name:
            "Гопарь",

        description:
            "+150 ₽ за свайп",

        cost:
            50000,

        add:
            150,

        level:
            0
    },

    {
        name:
            "Голубь",

        description:
            "+1000 ₽ за свайп",

        cost:
            1000000,

        add:
            1000,

        level:
            0
    },

{
    name: "Яжемать",
    description: "+5000 ₽ за свайп",
    cost: 5000000,
    add: 5000,
    level: 0
},

];


/* =========================
   ЦЕНА УЛУЧШЕНИЯ
========================= */


function getUpgradeCost(upgrade) {

    const tier =
        Math.floor(
            upgrade.level / 100
        );

    const multiplier =
        1.15 +
        (tier * 0.05);

    return Math.floor(
        upgrade.cost *
        Math.pow(
            multiplier,
            upgrade.level
        )
    );

}
/* =========================
   БОНУС УЛУЧШЕНИЯ
========================= */

function getUpgradeBonus(upgrade) {

    const tier =
        Math.floor(
            upgrade.level / 100
        );

    const bonusMultiplier =
        Math.pow(
            1.25,
            tier
        );

    return Math.floor(
        upgrade.add *
        bonusMultiplier
    );

}


/* =========================
   ПОКУПКА
========================= */

function buyUpgrade(index) {

    const upgrade =
        upgrades[index];


    const cost =
        getUpgradeCost(
            upgrade
        );


    if (
        game.balance <
        cost
    ) {

        return;

    }


    game.balance -=
        cost;


    game.power +=
        getUpgradeBonus(
            upgrade
        );


    upgrade.level++;


    renderShop();

    renderGame();

}


/* =========================
   МАГАЗИН
========================= */

function renderShop() {

    const list =
        document.getElementById(
            "shopList"
        );


    list.innerHTML =
        "";


    upgrades.forEach(
        function(
            upgrade,
            index
        ) {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "shop-item";


            const cost =
                getUpgradeCost(
                    upgrade
                );


            const canBuy =
                game.balance >=
                cost;


            item.innerHTML = `

                <div>

                    <div class="shop-name">

                        ${upgrade.name}

                        <span>
                            LVL ${upgrade.level}
                        </span>

                    </div>


                    <div class="shop-description">

                        +${formatNumber(
                            upgrade.add
                        )} ₽ за свайп

                    </div>

                </div>


                <button
                    class="shop-buy"
                    ${canBuy ? "" : "disabled"}
                >

                    ${formatNumber(
                        cost
                    )} ₽

                </button>

            `;


            item
                .querySelector(
                    "button"
                )
                .onclick =
                function() {

                    buyUpgrade(
                        index
                    );

                };


            list.appendChild(
                item
            );

        }
    );

}


/* =========================================================
   LEADERBOARD
   ========================================================= */

async function loadLeaderboard() {

    const list =
        document.getElementById(
            "leadersList"
        );


    if (!supabaseClient) {

        list.innerHTML = `
            <div class="empty">
                Сначала подключи Supabase.
            </div>
        `;

        return;

    }


    list.innerHTML = `
        <div class="empty">
            Загрузка рейтинга...
        </div>
    `;


    try {

        const {

            data,

            error

        } = await supabaseClient

            .from("players")

            .select(
                "vk_id,name,balance,swipes"
            )

            .order(
                "balance",
                {
                    ascending:
                        false
                }
            )

            .limit(50);


        if (error) {

            throw error;

        }


        if (
            !data ||
            data.length === 0
        ) {

            list.innerHTML = `
                <div class="empty">
                    Пока игроков нет.
                </div>
            `;

            return;

        }


        list.innerHTML =
            data.map(
                function(player, index) {

                    return `

                        <div class="leader">

                            <div class="leader-place">
                                #${index + 1}
                            </div>

                            <div class="leader-name">
                                ${escapeHTML(
                                    player.name ||
                                    "Игрок"
                                )}
                            </div>

                            <div class="leader-balance">
                                ${formatNumber(
                                    player.balance
                                )} ₽
                            </div>

                        </div>

                    `;

                }
            ).join("");


    } catch (error) {

        console.error(
            "LEADERBOARD:",
            error
        );

        list.innerHTML = `
            <div class="empty">
                Ошибка загрузки рейтинга.
            </div>
        `;

    }

}


function escapeHTML(text) {

    return String(text)
        .replace(
            /[&<>"']/g,
            function(character) {

                return {

                    "&":
                        "&amp;",

                    "<":
                        "&lt;",

                    ">":
                        "&gt;",

                    '"':
                        "&quot;",

                    "'":
                        "&#039;"

                }[character];

            }
        );

}


/* =========================================================
   PANELS
   ========================================================= */

const panels =
    document.querySelectorAll(
        ".panel"
    );


const navButtons =
    document.querySelectorAll(
        ".nav-button"
    );


navButtons.forEach(
    function(button) {

        button.addEventListener(
            "click",
            async function() {

                const panel =
                    button.dataset.panel;


                navButtons.forEach(
                    function(btn) {

                        btn.classList.remove(
                            "active"
                        );

                    }
                );


                button.classList.add(
                    "active"
                );


                if (
                    panel === "shop"
                ) {

                    document
                        .getElementById(
                            "shop"
                        )
                        .classList.add(
                            "open"
                        );

                    renderShop();

                }


                if (
                    panel === "leaders"
                ) {

                    document
                        .getElementById(
                            "leaders"
                        )
                        .classList.add(
                            "open"
                        );

                    await loadLeaderboard();

                }

            }
        );

    }
);


/* CLOSE */

document
    .querySelectorAll(
        ".close-button"
    )
    .forEach(
        function(button) {

            button.onclick =
                function() {

                    panels.forEach(
                        function(panel) {

                            panel.classList.remove(
                                "open"
                            );

                        }
                    );


                    navButtons.forEach(
                        function(btn) {

                            btn.classList.remove(
                                "active"
                            );

                        }
                    );


                    document
                        .querySelector(
                            '[data-panel="game"]'
                        )
                        .classList.add(
                            "active"
                        );

                };

        }
    );


/* =========================================================
   SAVE WHEN APP GOES BACKGROUND
   ========================================================= */

document.addEventListener(
    "visibilitychange",
    function() {

        if (
            document.visibilityState ===
            "hidden"
        ) {

            savePlayer();

        }

    }
);


window.addEventListener(
    "beforeunload",
    function() {

        savePlayer();

    }
);


/* =========================================================
   START
   ========================================================= */

async function startGame() {

    render();

    await initVK();

    await loadPlayer();

    render();

}


startGame();

</script>

</html>
