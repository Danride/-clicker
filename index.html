<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>VK Кликер</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #19191a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .game {
            width: 100%;
            max-width: 500px;
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin: 20px 0 10px;
            font-size: 32px;
        }

        .coins {
            font-size: 48px;
            font-weight: bold;
            margin: 30px 0;
        }

        .click-button {
            width: 220px;
            height: 220px;
            border: none;
            border-radius: 50%;
            background: #447bba;
            color: white;
            font-size: 30px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,.4);
            transition: transform .08s;
        }

        .click-button:active {
            transform: scale(.92);
        }

        .reset {
            margin-top: 40px;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            background: #333;
            color: white;
            cursor: pointer;
        }

        .status {
            margin-top: auto;
            font-size: 13px;
            opacity: .6;
        }

        .pop {
            animation: pop .15s ease;
        }

        @keyframes pop {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

<div class="game">

    <h1>💰 Кликер</h1>

    <div id="counter" class="coins">0</div>

    <button id="clickBtn" class="click-button">
        КЛИК
    </button>

    <button id="resetBtn" class="reset">
        Сбросить
    </button>

    <div id="status" class="status">
        Подключение к VK...
    </div>

</div>

<!-- VK Bridge -->
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

<script>

document.addEventListener("DOMContentLoaded", async function () {

    // =========================
    // VK MINI APP
    // =========================

    const statusEl = document.getElementById("status");

    try {

        await vkBridge.send("VKWebAppInit");

        statusEl.textContent = "✅ VK Mini App запущен";

        console.log("VK Bridge подключён");

    } catch (error) {

        statusEl.textContent = "⚠️ Тестовый режим";

        console.log("VK Bridge:", error);

    }


    // =========================
    // КЛИКЕР
    // =========================

    let count = 0;

    const counterEl =
        document.getElementById("counter");

    const clickBtn =
        document.getElementById("clickBtn");

    const resetBtn =
        document.getElementById("resetBtn");


    // Загружаем сохранение

    const saved =
        localStorage.getItem("clicker_count");

    if (saved !== null) {

        count = parseInt(saved, 10) || 0;

    }


    counterEl.textContent = count;


    // Клик

    clickBtn.addEventListener("click", function () {

        count++;

        counterEl.textContent = count;

        counterEl.classList.remove("pop");

        void counterEl.offsetWidth;

        counterEl.classList.add("pop");


        localStorage.setItem(
            "clicker_count",
            count
        );

    });


    // Сброс

    resetBtn.addEventListener("click", function () {

        if (confirm("Точно сбросить прогресс?")) {

            count = 0;

            counterEl.textContent = count;

            localStorage.setItem(
                "clicker_count",
                "0"
            );

        }

    });

});

</script>

</body>
</html>
