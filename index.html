<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VK Кликер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 20px;
        }
        .app {
            background: white;
            padding: 30px 20px;
            border-radius: 28px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 320px;
        }
        h1 {
            font-size: 24px;
            color: #222;
            margin-bottom: 10px;
        }
        .counter {
            font-size: 64px;
            font-weight: 800;
            color: #2d81e0;
            margin: 20px 0;
            transition: transform 0.1s;
        }
        .counter.pop {
            transform: scale(1.2);
        }
        .click-btn {
            background: #2d81e0;
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 60px;
            width: 100%;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 8px 0 #1a4f8b;
            margin-bottom: 20px;
        }
        .click-btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #1a4f8b;
        }
        .reset-btn {
            background: none;
            border: 1px solid #ccc;
            padding: 10px 20px;
            border-radius: 30px;
            color: #666;
            font-size: 14px;
            cursor: pointer;
        }
        .status {
            margin-top: 15px;
            font-size: 12px;
            color: #999;
        }
        .status.ok { color: #2d81e0; }
        .status.error { color: #e74c3c; }
    </style>
</head>
<body>
    <div class="app" id="app">
        <h1>🍪 Кликер</h1>
        <div class="counter" id="counter">0</div>
        <button class="click-btn" id="clickBtn">Кликни меня!</button>
        <br>
        <button class="reset-btn" id="resetBtn">Сбросить</button>
        <div id="status" class="status">Загрузка...</div>
    </div>

    <!-- ========== VK BRIDGE (ОБЯЗАТЕЛЬНО!) ========== -->
    <script src="https://vk.com/js/api/xd_connection.js?2"></script>
    
    <script>
        // --- Инициализация VK Bridge ---
        const statusEl = document.getElementById('status');
        
        try {
            VK.init(function() {
                statusEl.textContent = '✅ VK Bridge подключен!';
                statusEl.className = 'status ok';
                console.log('✅ VK инициализирован');
            }, function(error) {
                statusEl.textContent = '⚠️ VK Bridge ошибка (но приложение работает)';
                statusEl.className = 'status error';
                console.warn('⚠️ Ошибка VK:', error);
            });
        } catch(e) {
            statusEl.textContent = '⚠️ VK Bridge не загружен (тестовый режим)';
            statusEl.className = 'status error';
            console.warn('⚠️ VK Bridge ошибка:', e);
        }

        // --- Логика кликера ---
        let count = 0;
        const counterEl = document.getElementById('counter');
        const clickBtn = document.getElementById('clickBtn');
        const resetBtn = document.getElementById('resetBtn');

        function updateCounter() {
            counterEl.textContent = count;
            counterEl.classList.add('pop');
            setTimeout(() => {
                counterEl.classList.remove('pop');
            }, 150);
        }

        clickBtn.addEventListener('click', function() {
            count++;
            updateCounter();
            // Сохраняем прогресс
            localStorage.setItem('clicker_count', count);
        });

        resetBtn.addEventListener('click', function() {
            if (confirm('Точно сбросить?')) {
                count = 0;
                updateCounter();
                localStorage.setItem('clicker_count', count);
            }
        });

        // Загружаем сохраненный счет
        const saved = localStorage.getItem('clicker_count');
        if (saved !== null) {
            count = parseInt(saved, 10);
            counterEl.textContent = count;
        }
    </script>
</body>
</html>
