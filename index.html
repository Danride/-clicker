<style>
/* =========================================================
   RESET
========================================================= */
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080808;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    display: flex;
    justify-content: center;
}

.app {
    width: 100%;
    max-width: 520px;
    height: 100dvh;
    background: #0b0b0b;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
}

/* =========================================================
   HEADER
========================================================= */
header {
    height: 65px;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #242424;
}

.logo {
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 4px;
}

.connection {
    font-size: 9px;
    letter-spacing: 2px;
    color: #555;
}

.connection.online {
    color: #4ade80; /* Зеленый для наглядности синхронизации */
}

/* =========================================================
   MAIN
========================================================= */
main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.balance-label {
    color: #555;
    font-size: 9px;
    letter-spacing: 4px;
    margin-bottom: 20px;
}

.balance {
    font-size: 48px;
    font-weight: 900;
    letter-spacing: -2px;
    margin-top: -20px;
}

.currency {
    font-size: 14px;
    color: #666;
    margin-left: 5px;
}

/* =========================================================
   BAG
========================================================= */
.bag-wrapper {
    width: min(76vw, 320px);
    height: min(76vw, 320px);
    margin: -20px 0 15px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    user-select: none;
}

.bag {
    width: 68%;
    height: 74%;
    object-fit: contain;
    image-rendering: auto;
    position: relative;
    transition: transform .08s ease;
    pointer-events: none;
}

.bag.hit {
    animation: bagHit .16s ease;
}

@keyframes bagHit {
    0% { transform: rotate(-3deg) scale(1); }
    50% { transform: rotate(4deg) scale(.92); }
    100% { transform: rotate(-3deg) scale(1); }
}

/* =========================================================
   HINT
========================================================= */
.hint {
    color: #555;
    font-size: 9px;
    letter-spacing: 3px;
}

/* =========================================================
   STATS
========================================================= */
.stats {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 18px;
}

.stat {
    background: #0f0f0f;
    border: 1px solid #222;
    padding: 12px;
}

.stat-value {
    font-size: 15px;
    font-weight: 900;
}

.stat-label {
    margin-top: 4px;
    font-size: 8px;
    letter-spacing: 1px;
    color: #555;
}

/* =========================================================
   NAV
========================================================= */
nav {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    border-top: 1px solid #222;
    background: #090909;
    padding-bottom: env(safe-area-inset-bottom);
}

.nav-button {
    height: 58px;
    border: none;
    background: transparent;
    color: #555;
    font-size: 9px;
    letter-spacing: 2px;
}

.nav-button.active {
    color: #fff;
}

/* =========================================================
   PANELS
========================================================= */
.panel {
    position: absolute;
    inset: 0;
    background: #0b0b0b;
    z-index: 20;
    padding: 25px 20px;
    transform: translateY(100%);
    transition: transform .22s ease;
    overflow-y: auto;
}

.panel.open {
    transform: translateY(0);
}

.panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #222;
    padding-bottom: 15px;
    margin-bottom: 18px;
}

.panel-title {
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 3px;
}

.close-button {
    width: 34px;
    height: 34px;
    border: 1px solid #292929;
    background: #151515;
    color: #fff;
    font-size: 18px;
}

/* =========================================================
   SHOP
========================================================= */
.shop-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px;
    margin-bottom: 8px;
    border: 1px solid #242424;
    background: #0e0e0e;
}

.shop-name {
    font-size: 12px;
    font-weight: 900;
}

.shop-name span {
    margin-left: 8px;

    font-size: 9px;
}

.shop-description {
    margin-top: 4px;

    font-size: 9px;
}

.shop-buy {
    border: none;
    background: #eee;
    color: #080808;
    padding: 9px 12px;
    font-size: 9px;
    font-weight: 900;
    letter-spacing: 1px;
    cursor: pointer;
}

.shop-buy:disabled {
    opacity: .25;
    cursor: default;
}

/* =========================
   ПРОГРЕСС ОТКРЫТИЯ
========================= */
.unlock-progress {
    padding: 10px 15px 16px;
    margin-top: -8px;
    margin-bottom: 8px;
    background: #0a0a0a;
    border-left: 1px solid #242424;
    border-right: 1px solid #242424;
    border-bottom: 1px solid #242424;
}

.unlock-text {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
    color: #555;
    font-size: 9px;
}

.unlock-text b {
    color: #aaa;
}

.unlock-text span {
    margin-left: auto;
    color: #444;
}

.progress-bar {
    width: 100%;
    height: 3px;
    margin-top: 8px;
    background: #202020;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    background: #777;
    transition: width .2s ease;
}

.unlock-need {
    margin-top: 7px;
    color: #444;
    font-size: 8px;
    letter-spacing: .5px;
}

.unlock-need b {
    color: #888;
}

/* =========================================================
   LEADERBOARD
========================================================= */
.leader {
    display: grid;
    grid-template-columns: 40px 1fr auto;
    gap: 10px;
    align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid #1d1d1d;
}

.leader-place {
    color: #555;
    font-weight: 900;
}

.leader-name {
    font-size: 12px;
}

.leader-balance {
    font-size: 12px;
    font-weight: 900;
}

.empty {
    color: #555;
    font-size: 11px;
}

/* =========================================================
   TOAST
========================================================= */
.toast {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    padding: 0;
    background: transparent;
    color: white;
    font-size: 14px;
    font-weight: 900;
    text-shadow: 0 2px 5px rgba(0, 0, 0, .8);
    pointer-events: none;
    opacity: 0;
    z-index: 1000;
}

.toast.show {
    animation: toastAnimation .65s ease;
}

@keyframes toastAnimation {
    0% { opacity: 0; transform: translate(-50%, -20%) scale(.8); }
    20% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    70% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -100%) scale(1.05); }
}
</style>

</head>

<script>
/* =========================================================
   SUPABASE
========================================================= */
const SUPABASE_URL = "https://zlaykoibaxxohvpqqzyr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_mEiAWaehBEhKrwQ_tcWFvQ_-VqEuon2";

let supabaseClient = null;

if (
    !SUPABASE_URL.includes("ВСТАВЬ") &&
    !SUPABASE_ANON_KEY.includes("ВСТАВЬ")
) {
    supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );
}

/* =========================================================
   PLAYER (СИНХРОНИЗАЦИЯ ID)
========================================================= */
let savedVkId = localStorage.getItem("sync_vk_id");

if (!savedVkId) {
    savedVkId = "guest_" + Math.random().toString(36).substring(2);
    localStorage.setItem("sync_vk_id", savedVkId);
}

let player = {
    id: savedVkId,
    name: "Игрок"
};

/* =========================================================
   GAME
========================================================= */
let game = {
    balance: 0n,
    power: 1,
    swipes: 0,
    lastSyncedAt: 0 // [ПРАВКА] Добавлено для отслеживания актуальности данных
};

/* =========================================================
   DOM
========================================================= */
const balanceElement = document.getElementById("balance");
const powerElement = document.getElementById("power");
const swipesElement = document.getElementById("swipes");
const bag = document.getElementById("bag");
const bagWrapper = document.getElementById("bagWrapper");
const connection = document.getElementById("connection");
const toast = document.getElementById("toast");

/* =========================================================
   FORMAT NUMBER
========================================================= */
function formatNumber(number) {
    number = BigInt(number);
    if (number < 1000n) {
        return number.toString();
    }
    const units = ["", "K", "M", "B", "T", "Qa", "Qi", "Sx", "Sp", "Oc", "No", "Dc"];
    let tier = 0;
    let value = number;
    while (value >= 1000n && tier < units.length - 1) {
        value /= 1000n;
        tier++;
    }
    return (value.toString() + units[tier]);
}

/* =========================================================
   RENDER GAME
========================================================= */
function render() {
    balanceElement.textContent = formatNumber(game.balance);
    const digits = game.balance.toString().length;
    let size = 48 - (digits - 3) * 3;
    size = Math.max(28, Math.min(48, size));
    balanceElement.style.fontSize = size + "px";
    powerElement.textContent = formatNumber(game.power) + " ₽";
    swipesElement.textContent = formatNumber(game.swipes);
}

/* =========================================================
   TOAST
========================================================= */
function showToast(text) {
    toast.textContent = text;
    const rect = bagWrapper.getBoundingClientRect();
    const x = rect.left + rect.width * (0.25 + Math.random() * 0.5);
    const y = rect.top + rect.height * (0.25 + Math.random() * 0.5);
    toast.style.left = x + "px";
    toast.style.top = y + "px";
    toast.classList.remove("show");
    void toast.offsetWidth;
    toast.classList.add("show");
}

/* =========================================================
   VK
========================================================= */
async function initVK() {
    try {
        await vkBridge.send("VKWebAppInit");
        const user = await vkBridge.send("VKWebAppGetUserInfo");
        if (user && user.id) {
            player.id = String(user.id);
            player.name = (user.first_name + " " + user.last_name).trim();
            localStorage.setItem("sync_vk_id", player.id);
        }
        connection.textContent = "VK CONNECTED";
        connection.classList.add("online");
    } catch (error) {
        console.log("VK Bridge:", error);
        
        if (!savedVkId || savedVkId.startsWith("guest_")) {
            const inputId = prompt("Введите ваш VK ID (только цифры), чтобы синхронизировать прогресс с телефоном:\n(Если не знаете ID, откройте свой профиль VK, цифры в адресной строке после id)");
            if (inputId && /^\d+$/.test(inputId.trim())) {
                player.id = inputId.trim();
                localStorage.setItem("sync_vk_id", player.id);
                connection.textContent = "SYNCED (PC)";
                connection.classList.add("online");
            } else {
                connection.textContent = "GUEST MODE";
            }
        } else {
            connection.textContent = "SYNCED (PC)";
            connection.classList.add("online");
        }
    }
}

/* =========================================================
   LOAD PLAYER
========================================================= */
async function loadPlayer() {
    if (!supabaseClient) {
        connection.textContent = "SUPABASE NOT SET";
        return;
    }
    try {
        const { data, error } = await supabaseClient
            .from("players")
            .select("balance,power,swipes,name,upgrades,updated_at")
            .eq("vk_id", player.id)
            .maybeSingle();

        if (error) throw error;

        if (data) {
            game.balance = BigInt(data.balance || "0");
            game.power = Number(data.power) || 1;
            game.swipes = Number(data.swipes) || 0;
            game.lastSyncedAt = data.updated_at ? new Date(data.updated_at).getTime() : Date.now(); // [ПРАВКА] Запоминаем время последней записи
            
            if (Array.isArray(data.upgrades)) {
                data.upgrades.forEach(function(level, index) {
                    if (upgrades[index]) {
                        upgrades[index].level = Number(level) || 0;
                    }
                });
            }
        }
        connection.textContent = "ONLINE";
        connection.classList.add("online");
        render();
        renderShop();
    } catch (error) {
        console.error("Supabase LOAD:", error);
        connection.textContent = "DATABASE ERROR";
    }
}

/* =========================================================
   SAVE
========================================================= */
let saveTimeout = null;

function scheduleSave() {
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(savePlayer, 1000);
}

async function savePlayer() {
    if (!supabaseClient) return;
    try {
        const data = {
            vk_id: player.id,
            name: player.name,
            balance: game.balance.toString(),
            power: Math.floor(game.power),
            swipes: Math.floor(game.swipes),
            upgrades: upgrades.map(function(upgrade) {
                return upgrade.level;
            }),
            updated_at: new Date().toISOString()
        };

        const { error } = await supabaseClient
            .from("players")
            .upsert(data, { onConflict: "vk_id" });

        if (error) throw error;
        
        game.lastSyncedAt = Date.now(); // [ПРАВКА] Фиксируем время успешного сохранения
        console.log("GAME SAVED");
    } catch (error) {
        console.error("Supabase SAVE:", error);
    }
}

/* =========================================================
   REALTIME SYNC (СЛУШАЕМ ИЗМЕНЕНИЯ СЕРВЕРА)
========================================================= */
let realtimeChannel = null;

function startRealtimeSync() {
    if (!supabaseClient) return;

    if (realtimeChannel) {
        supabaseClient.removeChannel(realtimeChannel);
    }

    realtimeChannel = supabaseClient
        .channel('player-sync-' + player.id)
        .on(
            'postgres_changes',
            {
                event: '*',
                schema: 'public',
                table: 'players',
                filter: `vk_id=eq.${player.id}`
            },
            (payload) => {
                const newData = payload.new;
                
                const serverBalance = BigInt(newData.balance || "0");
                const serverSwipes = Number(newData.swipes) || 0;
                const serverPower = Number(newData.power) || 1;
                const serverUpdatedAt = newData.updated_at ? new Date(newData.updated_at).getTime() : 0; // [ПРАВКА] Получаем время обновления с сервера

                // Если данные идентичны, ничего не делаем
                if (serverBalance === game.balance && serverSwipes === game.swipes && serverPower === game.power) {
                    return;
                }

                // [ПРАВКА] Обновляем, если запись на сервере новее нашей последней синхронизации 
                // (допуск 1000 мс компенсирует небольшие задержки сети между устройствами)
                if (serverUpdatedAt > game.lastSyncedAt - 1000) {
                    game.balance = serverBalance;
                    game.power = serverPower;
                    game.swipes = serverSwipes;
                    game.lastSyncedAt = serverUpdatedAt;

                    if (Array.isArray(newData.upgrades)) {
                        newData.upgrades.forEach((level, index) => {
                            if (upgrades[index]) {
                                upgrades[index].level = Number(level) || 0;
                            }
                        });
                    }

                    console.log("🔄 Прогресс обновлен с другого устройства!");
                    render();
                    renderShop();
                } else {
                    console.log("⏭️ Игнорируем устаревшее обновление с сервера");
                }
            }
        )
        .subscribe((status) => {
            if (status === 'SUBSCRIBED') {
                console.log("✅ Realtime синхронизация активна");
            }
        });
}

/* =========================================================
   SWIPE SYSTEM
========================================================= */
let startX = 0;
let startY = 0;
let startTime = 0;
let touching = false;

bagWrapper.addEventListener("pointerdown", function(event) {
    touching = true;
    startX = event.clientX;
    startY = event.clientY;
    startTime = performance.now();
    bagWrapper.setPointerCapture?.(event.pointerId);
});

bagWrapper.addEventListener("pointerup", function(event) {
    if (!touching) return;
    touching = false;
    const dx = event.clientX - startX;
    const dy = event.clientY - startY;
    const distance = Math.sqrt(dx * dx + dy * dy);
    const duration = performance.now() - startTime;
    if (distance < 45 || duration > 1200) return;
    makeMoney();
});

bagWrapper.addEventListener("pointercancel", function() {
    touching = false;
});

/* =========================================================
   MAKE MONEY
========================================================= */
function makeMoney() {
    game.balance += BigInt(game.power);
    game.swipes++;
    bag.classList.remove("hit");
    void bag.offsetWidth;
    bag.classList.add("hit");
    showToast("+" + formatNumber(game.power) + " ₽");
    render();
    scheduleSave();
}

/* =========================================================
   UPGRADE COST
========================================================= */
function getUpgradeCost(upgrade) {
    const tier = Math.floor(upgrade.level / 100);
    const multiplier = 1.15 + (tier * 0.05);
    return Math.floor(upgrade.cost * Math.pow(multiplier, upgrade.level));
}

/* =========================================================
   UPGRADE BONUS
========================================================= */
function getUpgradeBonus(upgrade) {
    const tier = Math.floor(upgrade.level / 100);
    const bonusMultiplier = Math.pow(1.15, tier);
    return Math.floor(upgrade.add * bonusMultiplier);
}

/* =========================================================
   CHECK UNLOCK
========================================================= */
function isUpgradeUnlocked(index) {
    if (index === 0) return true;
    const previousUpgrade = upgrades[index - 1];
    const currentUpgrade = upgrades[index];
    return (previousUpgrade.level >= currentUpgrade.unlockLevel);
}

/* =========================================================
   BUY UPGRADE
========================================================= */
function buyUpgrade(index) {
    const upgrade = upgrades[index];
    if (!upgrade || !isUpgradeUnlocked(index)) return;
    const cost = getUpgradeCost(upgrade);
    if (game.balance < BigInt(cost)) return;
    
    game.balance -= BigInt(cost);
    game.power += getUpgradeBonus(upgrade);
    upgrade.level++;
    
    scheduleSave();
    renderShop();
    render();
}

/* =========================================================
   RENDER SHOP
========================================================= */
function renderShop() {
    const list = document.getElementById("shopList");
    list.innerHTML = "";

    upgrades.forEach(function(upgrade, index) {
        if (!isUpgradeUnlocked(index)) return;

        const item = document.createElement("div");
        item.className = "shop-item";

        const cost = getUpgradeCost(upgrade);
        const canBuy = game.balance >= BigInt(cost);

        const content = document.createElement("div");
        content.innerHTML = `
            <div class="shop-name">${upgrade.name} <span>LVL ${upgrade.level}</span></div>
            <div class="shop-description">+${formatNumber(upgrade.add)} ₽ за свайп</div>
        `;
        item.appendChild(content);

        const button = document.createElement("button");
        button.className = "shop-buy";
        button.textContent = formatNumber(cost) + " ₽";
        button.disabled = !canBuy;
        button.addEventListener("click", function(event) {
            event.preventDefault();
            event.stopPropagation();
            buyUpgrade(index);
        });
        item.appendChild(button);
        list.appendChild(item);

        const nextUpgrade = upgrades[index + 1];
        if (nextUpgrade) {
            const requiredLevel = nextUpgrade.unlockLevel;
            const currentLevel = upgrade.level;
            const remaining = Math.max(0, requiredLevel - currentLevel);
            const progress = Math.min(100, (currentLevel / requiredLevel) * 100);

            const progressBox = document.createElement("div");
            progressBox.className = "unlock-progress";
            progressBox.innerHTML = `
                <div class="unlock-text">🔒 Следующее: <b>${nextUpgrade.name}</b> <span>${currentLevel}/${requiredLevel} LVL</span></div>
                <div class="progress-bar"><div class="progress-fill" style="width: ${progress}%"></div></div>
                <div class="unlock-need">Нужно ещё <b>${remaining}</b> уровней</div>
            `;
            list.appendChild(progressBox);
        }
    });
}

/* =========================================================
   LEADERBOARD
========================================================= */
async function loadLeaderboard() {
    const list = document.getElementById("leadersList");
    if (!supabaseClient) {
        list.innerHTML = `<div class="empty">Сначала подключи Supabase.</div>`;
        return;
    }
    list.innerHTML = `<div class="empty">Загрузка рейтинга...</div>`;
    
    try {
        // Забираем данные без сортировки от БД, чтобы избежать ошибки текстовой сортировки
        const { data, error } = await supabaseClient
            .from("players")
            .select("vk_id, name, balance, swipes")
            .limit(100);

        if (error) throw error;
        if (!data || data.length === 0) {
            list.innerHTML = `<div class="empty">Пока игроков нет.</div>`;
            return;
        }

        // СОРТИРОВКА СТРОГО ПО ЧИСЛУ ДЕНЕГ (от большего к меньшему)
        data.sort((a, b) => {
            const moneyA = BigInt(a.balance || "0");
            const moneyB = BigInt(b.balance || "0");
            
            if (moneyA > moneyB) return -1; // У кого денег больше, тот выше (идет первым)
            if (moneyA < moneyB) return 1;  // У кого денег меньше, тот ниже
            
            // Если денег абсолютно поровну, выше тот, кто сделал больше свайпов
            const swipesA = Number(a.swipes || 0);
            const swipesB = Number(b.swipes || 0);
            return swipesB - swipesA;
        });

        list.innerHTML = data.map(function(player, index) {
            return `
                <div class="leader">
                    <div class="leader-place">#${index + 1}</div>
                    <div class="leader-name" onclick="openVKProfile('${player.vk_id}')">${escapeHTML(player.name || "Игрок")}</div>
                    <div class="leader-balance">${formatNumber(player.balance)} ₽</div>
                </div>
            `;
        }).join("");
        
    } catch (error) {
        console.error("LEADERBOARD:", error);
        list.innerHTML = `<div class="empty">Ошибка загрузки рейтинга.</div>`;
    }
}
/* =========================================================
   VK PROFILE
========================================================= */
function openVKProfile(vkId) {
    if (!vkId) return;
    window.open(`https://vk.com/id${vkId}`, "_blank");
}

/* =========================================================
   ESCAPE HTML
========================================================= */
function escapeHTML(text) {
    return String(text).replace(/[&<>"']/g, function(character) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[character];
    });
}

/* =========================================================
   PANELS
========================================================= */
const panels = document.querySelectorAll(".panel");
const navButtons = document.querySelectorAll(".nav-button");

navButtons.forEach(function(button) {
    button.addEventListener("click", async function() {
        const panel = button.dataset.panel;
        navButtons.forEach(btn => btn.classList.remove("active"));
        button.classList.add("active");

        if (panel === "shop") {
            document.getElementById("shop").classList.add("open");
            renderShop();
        }
        if (panel === "leaders") {
            document.getElementById("leaders").classList.add("open");
            await loadLeaderboard();
        }
    });
});

/* =========================================================
   CLOSE PANELS
========================================================= */
document.querySelectorAll(".close-button").forEach(function(button) {
    button.onclick = function() {
        panels.forEach(panel => panel.classList.remove("open"));
        navButtons.forEach(btn => btn.classList.remove("active"));
        document.querySelector('[data-panel="game"]').classList.add("active");
    };
});

/* =========================================================
   SAVE ON BACKGROUND
========================================================= */
document.addEventListener("visibilitychange", function() {
    if (document.visibilityState === "hidden") {
        savePlayer();
    }
});

window.addEventListener("beforeunload", function() {
    savePlayer();
});

/* =========================================================
   START GAME
========================================================= */
async function startGame() {
    render();
    await initVK();
    await loadPlayer();
    
    startRealtimeSync(); 
    
    render();
    renderShop();
}

startGame();
